name: real-data-check

on:
  workflow_dispatch:
  push:
    branches: [main, claude/focused-dirac-o1qp6d]
    paths: ["tools/**", "projects/**", ".github/workflows/real-data.yml"]

jobs:
  cn:
    runs-on: ubuntu-24.04  # Playwright's browser dependencies are not packaged for 26.04 yet
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the China product
        run: pip install -q -e "projects/cn-quant[dev]"
      - name: Unit tests
        run: python -m pytest -q projects/cn-quant
      - name: Real-data end-to-end run
        run: python tools/smoke_cn.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Screenshot the app on real data
        run: |
          npm install --no-save --silent playwright@1.56.1
          npx playwright install --with-deps chromium > /dev/null
          cd projects/cn-quant
          python -m streamlit run src/cnquant/app.py --server.port 8502 > ../../streamlit-cn.log 2>&1 &
          cd ../..
          mkdir -p shots-cn
          node tools/shots.js http://localhost:8502 shots-cn \
            '[["", "overview", []], ["stocks", "stocks", []], ["ipo", "ipo", ["打新日历", "新股提醒", "审核动态"]]]'
      - name: Print screenshots into the log
        if: always()
        run: python tools/dump_images.py shots-cn

  us:
    runs-on: ubuntu-24.04  # Playwright's browser dependencies are not packaged for 26.04 yet
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the US product
        run: pip install -q -e "projects/t212-quant[dev]"
      - name: Unit tests
        run: python -m pytest -q projects/t212-quant
      - name: Real-data end-to-end run
        run: python tools/smoke_us.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Screenshot the app on real data
        run: |
          npm install --no-save --silent playwright@1.56.1
          npx playwright install --with-deps chromium > /dev/null
          cd projects/t212-quant
          python -m streamlit run src/t212quant/app.py --server.port 8501 > ../../streamlit-us.log 2>&1 &
          cd ../..
          mkdir -p shots-us
          node tools/shots.js http://localhost:8501 shots-us \
            '[["", "overview", []], ["stocks", "stocks", ["历史回测", "单只股票分析"]], ["ipo", "ipo", ["IPO 日历", "新股提醒"]], ["etf", "etf", []], ["account", "account", []]]'
      - name: Print screenshots into the log
        if: always()
        run: python tools/dump_images.py shots-us

  launchers:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        product: [t212-quant, cn-quant]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: First start with the double-click launcher (installs everything)
        shell: bash
        run: |
          cd "projects/${{ matrix.product }}"
          if [ "${{ matrix.product }}" = "cn-quant" ]; then PORT=8502; else PORT=8501; fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            (cmd //c start-windows.bat < /dev/null > ../../launcher.log 2>&1 &)
          else
            (./start-mac.command < /dev/null > ../../launcher.log 2>&1 &)
          fi
          for i in $(seq 1 150); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:$PORT/" || true)
            if [ "$code" = "200" ]; then echo "App is up on port $PORT after $((i * 5))s"; exit 0; fi
            sleep 5
          done
          echo "App did not start"; exit 1
      - name: Launcher output
        if: always()
        shell: bash
        run: tail -40 launcher.log || true

  installer:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Install with the one-line command from the README
        shell: pwsh
        run: |
          $env:QA_NO_PAUSE = "1"
          irm "https://raw.githubusercontent.com/JUNYI80/cc-workspace/${{ github.sha }}/install-windows.bat" -OutFile "$env:TEMP\install-quant.bat"
          cmd /c "$env:TEMP\install-quant.bat"
          if ($LASTEXITCODE -ne 0) { throw "installer exit code $LASTEXITCODE" }
      - name: Check what was installed
        shell: pwsh
        run: |
          $t = if (Test-Path D:\) { "D:\QuantApps" } else { "$env:USERPROFILE\QuantApps" }
          Write-Host "Install folder: $t"
          Get-ChildItem $t | Format-Table Name, Length
          $need = @("us-stocks\.venv\Scripts\streamlit.exe", "cn-stocks\.venv\Scripts\streamlit.exe",
                    "us-stocks\start-windows.bat", "cn-stocks\src\cnquant\app.py",
                    "量化助手（美股）.lnk", "A股量化助手.lnk")
          foreach ($f in $need) { if (-not (Test-Path (Join-Path $t $f))) { throw "missing: $f" } }
          Copy-Item -LiteralPath (Join-Path $t "A股量化助手.lnk") "$env:TEMP\check.lnk"
          $s = (New-Object -ComObject WScript.Shell).CreateShortcut("$env:TEMP\check.lnk")
          Write-Host "Shortcut target:" $s.TargetPath
          if ($s.TargetPath -ne (Join-Path $t "cn-stocks\start-windows.bat")) { throw "wrong shortcut target" }
          $desktop = [Environment]::GetFolderPath('Desktop')
          Write-Host "Desktop: $desktop"
          if ($desktop -and (Test-Path $desktop)) {
            foreach ($f in @("量化助手（美股）.lnk", "A股量化助手.lnk")) { if (-not (Test-Path (Join-Path $desktop $f))) { throw "missing on desktop: $f" } }
            Write-Host "Both shortcuts are on the desktop"
          }
      - name: Start both installed apps the way the shortcuts do
        shell: pwsh
        run: |
          $t = if (Test-Path D:\) { "D:\QuantApps" } else { "$env:USERPROFILE\QuantApps" }
          foreach ($app in @(@("us-stocks", 8501), @("cn-stocks", 8502))) {
            Start-Process cmd -ArgumentList "/c", (Join-Path $t "$($app[0])\start-windows.bat") -WorkingDirectory (Join-Path $t $app[0])
            $ok = $false
            foreach ($i in 1..60) {
              try { if ((Invoke-WebRequest "http://localhost:$($app[1])/" -UseBasicParsing -TimeoutSec 5).StatusCode -eq 200) { $ok = $true; break } } catch { Start-Sleep 5 }
            }
            if (-not $ok) { throw "$($app[0]) did not start" }
            Write-Host "$($app[0]) is up on port $($app[1])"
          }
