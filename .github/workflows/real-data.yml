name: real-data-check

on:
  workflow_dispatch:
  push:
    branches: [main, claude/focused-dirac-o1qp6d]
    paths: ["tools/**", "projects/**", ".github/workflows/real-data.yml"]

jobs:
  cn:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the China product
        run: pip install -q -e "projects/cn-quant[dev]"
      - name: Unit tests
        run: python -m pytest -q projects/cn-quant
      - name: Real-data end-to-end run
        run: python tools/smoke_cn.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Screenshot the app on real data
        run: |
          npm install --no-save --silent playwright@1.56.1
          npx playwright install --with-deps chromium > /dev/null
          cd projects/cn-quant
          python -m streamlit run src/cnquant/app.py --server.port 8502 > ../../streamlit-cn.log 2>&1 &
          cd ../..
          mkdir -p shots-cn
          node tools/shots.js http://localhost:8502 shots-cn \
            '[["", "overview", []], ["stocks", "stocks", []], ["ipo", "ipo", ["打新日历", "新股提醒", "审核动态"]]]'
      - name: Print screenshots into the log
        if: always()
        run: python tools/dump_images.py shots-cn

  us:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the US product
        run: pip install -q -e "projects/t212-quant[dev]"
      - name: Unit tests
        run: python -m pytest -q projects/t212-quant
      - name: Real-data end-to-end run
        run: python tools/smoke_us.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Screenshot the app on real data
        run: |
          npm install --no-save --silent playwright@1.56.1
          npx playwright install --with-deps chromium > /dev/null
          cd projects/t212-quant
          python -m streamlit run src/t212quant/app.py --server.port 8501 > ../../streamlit-us.log 2>&1 &
          cd ../..
          mkdir -p shots-us
          node tools/shots.js http://localhost:8501 shots-us \
            '[["", "overview", []], ["stocks", "stocks", ["历史回测", "单只股票分析"]], ["ipo", "ipo", ["IPO 日历", "新股提醒"]], ["etf", "etf", []], ["account", "account", []]]'
      - name: Print screenshots into the log
        if: always()
        run: python tools/dump_images.py shots-us

  launchers:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        product: [t212-quant, cn-quant]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: First start with the double-click launcher (installs everything)
        shell: bash
        run: |
          cd "projects/${{ matrix.product }}"
          if [ "${{ matrix.product }}" = "cn-quant" ]; then PORT=8502; else PORT=8501; fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            (cmd //c start-windows.bat < /dev/null > ../../launcher.log 2>&1 &)
          else
            (./start-mac.command < /dev/null > ../../launcher.log 2>&1 &)
          fi
          for i in $(seq 1 150); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:$PORT/" || true)
            if [ "$code" = "200" ]; then echo "App is up on port $PORT after $((i * 5))s"; exit 0; fi
            sleep 5
          done
          echo "App did not start"; exit 1
      - name: Launcher output
        if: always()
        shell: bash
        run: tail -40 launcher.log || true
