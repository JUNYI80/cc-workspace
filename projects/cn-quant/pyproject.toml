[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cnquant"
version = "0.1.0"
description = "A 股量化助手：中证 800 多因子选股、新股与 IPO 跟踪"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.2",
    "requests>=2.31",
    "yfinance>=0.2.54",
    "python-calamine>=0.2",  # reads the official CSI constituents .xls files
    "openpyxl>=3.1",
]

[project.optional-dependencies]
app = ["streamlit>=1.40", "altair>=5"]
dev = ["pytest>=7", "streamlit>=1.40", "altair>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
