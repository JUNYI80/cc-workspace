# The launcher opens the browser itself; headless also skips Streamlit's first-run email prompt.
[server]
headless = true
port = 8501
address = "localhost"  # only this computer can open the app (it can hold API keys)

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"  # hide the developer "Deploy" button

[theme]
font = "system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif"
headingFontSizes = ["2rem", "1.35rem", "1.1rem"]
baseRadius = "0.6rem"

[theme.light]
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f1f0ec"
textColor = "#0b0b0b"
borderColor = "#e1e0d9"

[theme.dark]
primaryColor = "#3987e5"
backgroundColor = "#1a1a19"
secondaryBackgroundColor = "#262624"
textColor = "#f0efec"
borderColor = "#383835"
