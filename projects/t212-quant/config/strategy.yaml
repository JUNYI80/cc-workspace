# Trend-filtered dual-momentum ETF rotation, monthly rebalance.
# All instruments are GBP-priced (GBX = pence) LSE-listed UCITS ETFs, so the
# Trading 212 FX fee does not apply and all of them can be held in a Stocks ISA.
#
# The ISINs are used to look up Trading 212 tickers. Before trading, run
#   t212q resolve --env demo
# and check that every matched instrument name is the ETF you expect.

account_currency: GBP
start: "2010-01-01"

assets:
  - {symbol: VUSA.L, name: Vanguard S&P 500,                  isin: IE00B3XXRP09}
  - {symbol: EQQQ.L, name: Invesco EQQQ Nasdaq-100,           isin: IE0032077012}
  - {symbol: VUKE.L, name: Vanguard FTSE 100,                 isin: IE00B810Q511}
  - {symbol: VEUR.L, name: Vanguard FTSE Developed Europe,    isin: IE00B945VV12}
  - {symbol: VJPN.L, name: Vanguard FTSE Japan,               isin: IE00B95PGT31}
  - {symbol: VFEM.L, name: Vanguard FTSE Emerging Markets,    isin: IE00B3VVMM84}
  - {symbol: IUKP.L, name: iShares UK Property,               isin: IE00B1TXLS18}
  - {symbol: SGLN.L, name: iShares Physical Gold,             isin: IE00B4ND3602}
  - {symbol: IGLT.L, name: iShares Core UK Gilts,             isin: IE00B1FZSB30}
  - {symbol: INXG.L, name: iShares GBP Index-Linked Gilts,    isin: IE00B1FZSD53}
  # Defensive "cash" leg: unallocated weight goes here.
  - {symbol: ERNS.L, name: iShares GBP Ultrashort Bond,       isin: IE00BCRY6557, role: cash}

strategy:
  lookbacks: [63, 126, 252]  # momentum = mean of 3, 6 and 12-month returns
  trend_window: 200          # must trade above its 200-day moving average
  top_n: 3                   # hold the 3 strongest eligible assets
  vol_window: 63             # volatility estimate window (inverse-vol sizing, vol target)
  target_vol: 0.12           # cap expected portfolio volatility at 12%/yr; null disables
  max_weight: 0.5            # no single ETF above 50%

execution:
  rebalance_band: 0.03       # ignore weight changes under 3 percentage points
  cost_bps: 10               # assumed spread/slippage per trade (backtest)
  cash_buffer: 0.02          # keep 2% of the sleeve in uninvested cash
  min_order_value: 10        # GBP; skip smaller orders
  max_order_value: 2500      # GBP; refuse to run if any single order is bigger
  quantity_decimals: 2       # fractional share precision sent to Trading 212
  capital_cap: null          # GBP; max money the bot manages (null = all free cash + its holdings)
  fill_timeout_s: 180        # wait this long for sells to fill before buying

benchmarks:
  - name: Buy & hold VWRL
    weights: {VWRL.L: 1.0}
  - name: 60/40 VWRL/IGLT
    weights: {VWRL.L: 0.6, IGLT.L: 0.4}
