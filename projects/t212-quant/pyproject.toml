[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "t212quant"
version = "0.1.0"
description = "Trend-filtered momentum ETF rotation with Trading 212 execution"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.1",
    "pyyaml>=6",
    "requests>=2.31",
    "yfinance>=0.2.40",
    "tzdata; platform_system == \"Windows\"",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7", "matplotlib>=3.7"]

[project.scripts]
t212q = "t212quant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
